name: Build Noctis Linux

on:
  push:
    tags:
      - "build-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install AppImage dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build AppImage and DEB (x64 + arm64)
        run: npx electron-builder --linux --x64 --arm64 --publish never

      - name: Publish Linux release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: Noctis Linux 1.3.1
          generate_release_notes: true
          files: |
            installer/Noctis-1.3.1-x86_64.AppImage
            installer/Noctis-1.3.1-arm64.AppImage
            installer/Noctis-1.3.1-amd64.deb
            installer/Noctis-1.3.1-arm64.deb
